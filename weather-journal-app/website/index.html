<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Weather Journal</title>
<link href="https://fonts.googleapis.com/css?family=Oswald:400,600,700|Ranga:400,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
 <body>
<div id = "app">
  <div class ="headline">
    Weather Journal App
  </div>
  <div class = "holder">
  <div class ="city">
    <label for="city">Enter city here:</label>
    <input type="text" id="city" placeholder="city name">
  </div>
  <div class ="feel">
    <label for="feelings">How are you feeling today:</label>
    <input class= "myInput" id="feelings" placeholder="I am feeling..." rows="9" cols="50"></input>
  </div>
  <button id="generate" type = "submit" onclick="generate()"> Generate </button>
  </div>
  <div class ="weather-card">
    <div id = "date"></div>
    <div id = "weather-main">
      <div id = "temp"></div>
      <div id="weather-info">
        <div id = "weather"></div>
        <div id = "wind-speed"></div>
      </div>
        <div id = "feeling"></div>
    </div>
      
  </div>
<script src="app.js" type="text/javascript"></script>

</body>
</html>
